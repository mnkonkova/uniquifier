# Уникализатор — все ручки в одном месте.

# Скорость ролика: множитель из коридора, высота голоса не меняется (atempo).
# Значения ближе к 1.0, чем dead_zone, не выдаются — такой сдвиг ничего не даёт.
speed:
  min: 0.97
  max: 1.03
  dead_zone: 0.01

# Шум поверх кадра (нарезки из noise/pack). strength — насколько заметно, в
# уровнях яркости из 255: 2–3 видно только на паузе, 4 уже заметно на стенах, 8+ — «плёнка».
# На хэш Meta шум не влияет (замер: 100% совпавших кадров при шуме 25%), он
# здесь для вида, а не для уникальности.
noise:
  pack: noise/pack
  strength: 2.5

# Рамка кадра (приближение + сдвиг). Набор рамок замерен и зашит в
# uniquify.py → FRAMINGS; здесь только поля, которые нельзя срезать.
framing:
  # Крайние пиксели титров по ширине кадра 1080 (замер по .ass «бот работ»).
  text_left: 95
  text_right: 994
  text_margin: 8

# Гейт уникальности (qa_dedup.py), пороги Meta vPDQ.
gate:
  distance: 31     # кадры совпадают при расстоянии Хэмминга ≤ 31 из 256
  fail_pct: 0      # пара не проходит, если совпал хотя бы один кадр

render:
  crf: 19
  preset: medium
  jobs: 3          # сколько ffmpeg одновременно
