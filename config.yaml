# Уникализатор — все ручки в одном месте.

# Скорость ролика: множитель из коридора, высота голоса не меняется (atempo).
# Значения ближе к 1.0, чем dead_zone, не выдаются — такой сдвиг ничего не даёт.
speed:
  min: 0.97
  max: 1.03
  dead_zone: 0.01

# Тон голоса: ступени высоты. Ступени, а не коридор:
# звук двух роликов расходится только при разнице тона ≥3% (замер Chromaprint).
# formant сохраняется — на слух ±3% не заметно (проверено на «бот работ»).
# Без 1.0: со скоростью, но без тона звук остаётся похож на свой оригинал
# (34–50% совпавших отрезков на тесте), с ±3% — 11–17%.
pitch:
  levels: [0.97, 1.03]

# Рамка кадра (приближение + сдвиг ± наклон). Сами облики подбираются под
# материал при запуске (palette.py); здесь только то, что нельзя срезать.
framing:
  # Прямоугольник титров в кадре 1080×1920: left, top, right, bottom
  # (замер по .ass всех 200 роликов «бот работ»).
  text_box: [95, 1306, 994, 1619]
  text_margin: 8
  # Сколько кадра можно срезать сверху/снизу, px. Сверху — шапка приложения на
  # экранах демо, снизу — меню приложения (в Instagram его и так перекрывает UI).
  max_top: 150
  max_bottom: 230

# Гейт уникальности (qa_dedup.py). Видео-хэш Meta vPDQ: кадр раз в секунду,
# две пары кадров совпадают при расстоянии ≤ distance бит из 256.
gate:
  distance: 31     # порог PDQ от Meta, не трогать без причины
  # ПОРОГ: пара роликов не проходит, если у неё больше fail_pct % общих кадров.
  # Меняйте здесь (или разово флагом --threshold). Ориентиры на 450 роликах
  # «бот работ»: 0 → ~134 уникальных, 10 → ~207, 20 → ~359, 30 → все 450.
  # Instagram свой порог не публикует; в примере Meta vPDQ копия — от 80%.
  fail_pct: 30
  # Звук (qa_audio.py, Chromaprint): пара не проходит при > audio_fail_pct %
  # совпавших отрезков. Разные ролики — ~1%, общий хук и совет — ~90%.
  audio_fail_pct: 30

render:
  crf: 19
  preset: medium
  jobs: 3          # сколько ffmpeg одновременно
