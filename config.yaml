# Уникализатор — все ручки в одном месте.

# Скорость ролика: множитель из коридора, высота голоса не меняется (atempo).
# Значения ближе к 1.0, чем dead_zone, не выдаются — такой сдвиг ничего не даёт.
speed:
  min: 0.97
  max: 1.03
  dead_zone: 0.01

# Тон голоса: ступени высоты. Ступени, а не коридор:
# звук двух роликов расходится только при разнице тона ≥3% (замер Chromaprint).
# formant сохраняется — на слух ±3% не заметно (проверено на «бот работ»).
# Без 1.0: со скоростью, но без тона звук остаётся похож на свой оригинал
# (34–50% совпавших отрезков на тесте), с ±3% — 11–17%.
pitch:
  levels: [0.97, 1.03]

# Рамка кадра (приближение + сдвиг ± наклон). Облики подбираются под материал
# при запуске (palette.py); профиль задаёт, что нельзя срезать. Всё — в ДОЛЯХ
# кадра, поэтому годится для любого размера и соотношения сторон.
framing:
  profile: reels          # по умолчанию; разово — флагом --profile
  profiles:
    # Готовые рилсы: верх и низ кадра в Instagram всё равно перекрыты интерфейсом
    # (шапка, подписи, кнопки), поэтому там можно срезать больше.
    reels:
      # Прямоугольник титров (left, top, right, bottom). Замерен по .ass партии
      # «бот работ» (95…994 × 1306…1619 px в кадре 1080×1920) — для другого
      # материала замерьте свой или поставьте null.
      text_box: [0.088, 0.680, 0.920, 0.843]
      text_margin: 0.0074   # 8 px из 1080
      max_top: 0.078        # 150 px из 1920
      max_bottom: 0.120     # 230 px из 1920
    # Сырое / не нарезанное видео: интерфейса нет, края — часть кадра. Срезается
    # не больше 5% с каждой стороны, титры не защищаются (их ещё нет). Замер на
    # горизонтальном подкасте: поле 3% — 0 обликов (рамка слишком слабая, чтобы
    # уйти от оригинала), 4% — 4, 5% — 6, 6% — 9. Против 20 у рилсов —
    # `capacity --profile raw` покажет, сколько роликов это разведёт.
    raw:
      text_box: null
      max_top: 0.05
      max_bottom: 0.05
      max_side: 0.05

# Гейт уникальности (qa_dedup.py). Видео-хэш Meta vPDQ: кадр раз в секунду,
# две пары кадров совпадают при расстоянии ≤ distance бит из 256.
gate:
  distance: 31     # порог PDQ от Meta, не трогать без причины
  # ПОРОГ: пара роликов не проходит, если у неё больше fail_pct % общих кадров.
  # Меняйте здесь (или разово флагом --threshold). Ориентиры на 450 роликах
  # «бот работ»: 0 → ~134 уникальных, 10 → ~207, 20 → ~359, 30 → все 450.
  # Instagram свой порог не публикует; в примере Meta vPDQ копия — от 80%.
  fail_pct: 30
  # Звук (qa_audio.py, Chromaprint): пара не проходит при > audio_fail_pct %
  # совпавших отрезков. Разные ролики — ~1%, общий хук и совет — ~90%.
  audio_fail_pct: 30

render:
  crf: 19
  preset: medium
  jobs: 3          # сколько ffmpeg одновременно
